  - {abreviatura: "DM1", expansion: "diabetes mellitus tipo 1"}
  - {abreviatura: "DM", expansion: "diabetes mellitus"}
  - {abreviatura: "EPOC", expansion: "enfermedad pulmonar obstructiva crónica"}
  - {abreviatura: "IC", expansion: "insuficiencia cardiaca"}
  - {abreviatura: "IAM", expansion: "infarto agudo de miocardio"}
