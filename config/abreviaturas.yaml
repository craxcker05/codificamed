  # Servicios y otros
  - {abreviatura: "UCI", expansion: "unidad de cuidados intensivos"}
  - {abreviatura: "URG", expansion: "urgencias"}
  - {abreviatura: "CC", expansion: "consulta cardiológica"}
  - {abreviatura: "IESS", expansion: "Instituto Ecuatoriano de Seguridad Social"}
  - {abreviatura: "RN", expansion: "recién nacido"}
  - {abreviatura: "G/P", expansion: "gestas y partos"}
