[project]
name = "codificamed"
version = "0.1.0"
description = "Prototipo que sugiere códigos CIE-10 a partir de notas clínicas en español, con evidencia textual y detección de negaciones."
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = { text = "Proyecto académico ESPOCH" }
dependencies = [
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "pandas>=2.2",
    "pyarrow>=16.0",
    "matplotlib>=3.9",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
# Embeddings y búsqueda vectorial (pesados: arrastran torch).
ml = [
    "sentence-transformers>=3.0",
    "chromadb>=0.5",
    "scikit-learn>=1.5",
]
# Proveedores de LLM. Solo se activa el que indique LLM_PROVIDER en .env.
llm = [
    "ollama>=0.4",
    "google-genai>=1.0",
]
app = [
    "streamlit>=1.37",
]
dev = [
    "pytest>=8.2",
]

[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/codificamed", "config"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["."]
